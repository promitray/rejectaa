name: Rejecta CI & E2E Scenario Evaluation

on:
  push:
    branches: [ main, develop, 'feat/**' ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-evaluate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code & Test Fixtures
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Dependencies for Document & PDF Processing
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils libmupdf-dev

      - name: Install Python Dependencies
        run: |
          cd rejectaa/rejecta-api
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install langwatch-scenario pytest-html pytest-asyncio

      # Stage 1: Deterministic Fast Unit Tests (0 API Cost)
      - name: Run Core Unit & Guard Tests
        run: |
          cd rejectaa/rejecta-api
          pytest tests/test_documents.py tests/test_analysis_guard.py tests/test_parser_docx.py tests/test_paper_structure.py tests/test_scoring_accuracy_step1.py -v --junitxml=junit-unit.xml

      # Stage 2: LangWatch Scenario Paper Pipeline E2E Evaluation
      - name: Run Scenario Paper Analysis Evaluation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LANGWATCH_API_KEY: ${{ secrets.LANGWATCH_API_KEY }}
          TEST_PAPERS_DIR: ${{ github.workspace }}/rejectaa/rejecta-api/eval/papers
        run: |
          cd rejectaa/rejecta-api
          pytest scenarios/test_scenario_paper_analysis.py -v --html=evaluation_report.html --self-contained-html

      # Stage 3: Publish Interactive HTML Report as Artifact
      - name: Upload HTML Evaluation Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rejecta-paper-analysis-evaluation-report
          path: rejectaa/rejecta-api/evaluation_report.html

      # Stage 4: Post Evaluation Summary to GitHub Action Summary
      - name: Publish Step Summary
        if: always()
        run: |
          echo "## 📄 Rejecta Paper Analysis Pipeline Evaluation" >> $GITHUB_STEP_SUMMARY
          echo "### 🚀 CI Evaluation Status" >> $GITHUB_STEP_SUMMARY
          echo "- **Unit Tests**: Passed" >> $GITHUB_STEP_SUMMARY
          echo "- **Scenario E2E Evaluations**: Executed via LangWatch Scenario" >> $GITHUB_STEP_SUMMARY
          echo "- **Quote Grounding & Integrity**: Verified against paper manuscripts" >> $GITHUB_STEP_SUMMARY
          echo "Download the \`rejecta-paper-analysis-evaluation-report\` artifact to view full interactive traces." >> $GITHUB_STEP_SUMMARY

