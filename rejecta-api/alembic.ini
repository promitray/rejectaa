# Alembic config for Rejecta. Migrations are raw SQL (no ORM models).
# The database URL is NOT stored here: env.py reads MIGRATION_DATABASE_URL
# from the environment / .env through config.settings.
#
#   alembic upgrade head        apply all migrations
#   alembic downgrade -1        roll back one migration
#   alembic history             list migrations
#   alembic current             show the applied revision

[alembic]
script_location = db/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
